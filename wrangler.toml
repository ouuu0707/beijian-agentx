name = "beijian-agentx"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Workers AI 绑定
[ai]
binding = "AI"

# Vectorize 向量数据库绑定
[[vectorize]]
binding = "VECTORIZE"
index_name = "spare-parts-index"

# TODO: KV 未配置时暂不绑定，配置后恢复下方注释代码
# [[kv_namespaces]]
# binding = "QA_CACHE"
# id = "请替换为你的 KV namespace ID"
#
# [[kv_namespaces]]
# binding = "VECTOR_CACHE"
# id = "请替换为你的 KV namespace ID"

# 环境变量
[vars]
ENVIRONMENT = "development"

# 生产环境：使用更强模型
[env.production]
vars = { ENVIRONMENT = "production" }

# 限流配置（通过 Cloudflare Rate Limiting Rules 在 Dashboard 中配置）
# 此处仅声明常量，限流逻辑在代码中实现
[vars.RATE_LIMIT]
MAX_REQUESTS_PER_MINUTE = "30"
